server:
  port: 7777

spring:
  application:
    name: los-service

  r2dbc:
    url: r2dbc:postgresql://host.docker.internal:5432/los-service
    username: postgres
    password: postgres

  liquibase:
    enabled: true
    url: jdbc:postgresql://host.docker.internal:5432/los-service
    user: postgres
    password: postgres
    change-log: classpath:/db/changelog/db.changelog-master.yaml

logging:
  level:
    root: INFO
    org.springframework.r2dbc: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
  client-id: ${KAFKA_CLIENT_ID:approval-service}

  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
    acks: all
    retries: 2147483647
    properties:
      enable.idempotence: true
      max.in.flight.requests.per.connection: 5
      delivery.timeout.ms: 120000

  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP:approval-service}
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    enable-auto-commit: false
    auto-offset-reset: earliest
    properties:
      isolation.level: read_committed

  listener:
    ack-mode: manual_immediate
    concurrency: ${KAFKA_CONCURRENCY:3}

jwt:
  secret: dev-secret-key-change-me
  encryptionKey: dev-encryption-key-change-me
  keys:
    client2BackPublicKey: dummy-public-key-value
    back2BackKey: dummy-back-to-back-key-value

